<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestor de Pendientes - Maria Alonso</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script async defer crossorigin="anonymous" src="https://connect.facebook.net/es_LA/sdk.js"></script>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --accent: #6366f1; --accent-hover: #4f46e5;
    --text: #e2e8f0; --text-dim: #94a3b8; --done: #22c55e; --danger: #ef4444; --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, var(--bg), #1a2332);
    min-height: 100vh; padding: 30px 16px; color: var(--text);
  }
  .container { width: 100%; max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.5rem; }
  .subtitle { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  input, select {
    padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: #0f172a; color: var(--text); font-size: 0.9rem; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  button {
    cursor: pointer; border: none; border-radius: 8px; font-weight: 600;
    background: var(--accent); color: white; padding: 10px 16px; font-size: 0.88rem;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  button.danger { background: var(--danger); }
  .hidden { display: none !important; }
  .error { color: var(--danger); font-size: 0.85rem; margin-top: 8px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .tabs button { background: transparent; border: 1px solid var(--border); color: var(--text-dim); border-radius: 20px; }
  .tabs button.active { background: var(--accent); color: white; border-color: var(--accent); }
  .week-nav { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .week-nav span { font-size: 0.9rem; color: var(--text-dim); }
  .client-group { margin-bottom: 18px; }
  .client-group h3 { font-size: 0.95rem; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  ul.tasklist { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  li {
    display: flex; align-items: center; gap: 10px; background: #0f172a;
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
  }
  li .check {
    width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--accent);
    flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  li.done .check { background: var(--done); border-color: var(--done); }
  li .check svg { display: none; width: 12px; height: 12px; }
  li.done .check svg { display: block; }
  li .info { flex: 1; }
  li .title { font-size: 0.92rem; }
  li.done .title { text-decoration: line-through; color: var(--text-dim); }
  li .meta { font-size: 0.72rem; color: var(--text-dim); margin-top: 2px; }
  li .delete { background: transparent; color: var(--danger); font-size: 1.1rem; padding: 2px 6px; }
  .empty { text-align: center; color: var(--text-dim); padding: 24px 0; font-size: 0.88rem; }
  .form-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .form-row input, .form-row select { flex: 1; min-width: 140px; }
  #loginScreen .card { max-width: 340px; margin: 60px auto 0; }
  #loginScreen input { width: 100%; margin-bottom: 10px; }
  #loginScreen button { width: 100%; }
  .admin-badge { font-size: 0.7rem; background: var(--accent); padding: 2px 8px; border-radius: 10px; margin-left: 8px; }
  .status-msg { font-size: 0.82rem; margin-top: 8px; }
  .status-msg.ok { color: var(--done); }
  .status-msg.err { color: var(--danger); }
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6); display: flex; align-items: flex-start; justify-content: center;
    padding: 30px 16px; overflow-y: auto; z-index: 100;
  }
  .modal-box { width: 100%; max-width: 680px; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="container">

  <!-- LOGIN -->
  <div id="loginScreen">
    <h1>📋 Gestor de Pendientes</h1>
    <p class="subtitle">Maria Alonso · Agencia Boutique</p>
    <div class="card">
      <input type="email" id="emailInput" placeholder="Tu email" />
      <input type="password" id="pinInput" placeholder="Tu PIN" />
      <button id="loginBtn">Entrar</button>
      <div class="error" id="loginError"></div>
    </div>
  </div>

  <!-- APP -->
  <div id="appScreen" class="hidden">
    <div class="top-bar">
      <div>
        <h1 style="font-size:1.2rem;">📋 Pendientes <span id="roleBadge" class="admin-badge hidden">ADMIN</span></h1>
        <p class="subtitle" id="userLabel" style="margin-bottom:0;"></p>
      </div>
      <button class="secondary" id="logoutBtn">Salir</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="semanal">Vista Semanal</button>
      <button class="tab-btn" data-tab="general360">360 General</button>
      <button class="tab-btn hidden" data-tab="admin" id="adminTabBtn">Admin</button>
    </div>
    <div style="margin-bottom:18px;">
      <button id="openRrssBtn">📊 Reporte RR.SS</button>
    </div>

    <!-- Formulario nueva tarea -->
    <div class="card" id="newTaskCard">
      <div class="form-row">
        <input type="text" id="taskTitle" placeholder="Título de la tarea..." />
      </div>
      <div class="form-row">
        <select id="taskClient"><option value="">Sin marca/cliente</option></select>
        <select id="taskAssignee"><option value="">Sin asignar</option></select>
        <input type="date" id="taskWeek" />
      </div>
      <button id="addTaskBtn">Agregar tarea</button>
      <div class="status-msg" id="addTaskStatus"></div>
    </div>

    <!-- TAB: Vista semanal -->
    <div id="tab-semanal" class="tab-content">
      <div class="week-nav">
        <button class="secondary" id="prevWeek">← Semana anterior</button>
        <span id="weekLabel"></span>
        <button class="secondary" id="nextWeek">Semana siguiente →</button>
      </div>
      <div class="card">
        <ul class="tasklist" id="weeklyList"></ul>
      </div>
    </div>

    <!-- TAB: 360 -->
    <div id="tab-general360" class="tab-content hidden">
      <div id="clientGroups"></div>
    </div>

    <!-- MODAL: Reporte RR.SS -->
    <div id="rrssModal" class="modal-overlay hidden">
      <div class="modal-box">
        <div class="modal-header">
          <h2 style="font-size:1.2rem;">📊 Reporte RR.SS</h2>
          <button class="secondary" id="closeRrssBtn">✕ Cerrar</button>
        </div>

        <div class="card">
          <div class="form-row">
            <select id="reportClient"></select>
            <select id="reportRange">
              <option value="7">Últimos 7 días</option>
              <option value="28" selected>Últimos 28 días</option>
              <option value="90">Últimos 90 días</option>
            </select>
            <button class="secondary" id="connectIgBtn">📷 Conectar Instagram</button>
          </div>
          <div class="status-msg" id="reportStatus"></div>
        </div>

        <div class="card" id="summaryCards" style="display:flex; gap:12px; flex-wrap:wrap;"></div>

        <div class="card">
          <h3 style="margin-bottom:10px;">Seguidores en el tiempo</h3>
          <canvas id="followersChart" height="90"></canvas>
        </div>

        <div class="card">
          <h3 style="margin-bottom:10px;">Alcance e impresiones</h3>
          <canvas id="reachChart" height="90"></canvas>
        </div>

        <div class="card">
          <h3 style="margin-bottom:10px;">Publicaciones con mejor rendimiento</h3>
          <ul class="tasklist" id="topPostsList"></ul>
        </div>
      </div>
    </div>

    <!-- TAB: Admin -->
    <div id="tab-admin" class="tab-content hidden">
      <div class="card">
        <h3 style="margin-bottom:10px;">Crear marca / cliente</h3>
        <div class="form-row">
          <input type="text" id="newClientName" placeholder="Nombre de la marca" />
          <input type="color" id="newClientColor" value="#6366f1" style="width:50px;padding:2px;" />
        </div>
        <button id="addClientBtn">Crear marca</button>
        <div class="status-msg" id="clientStatus"></div>
      </div>

      <div class="card">
        <h3 style="margin-bottom:10px;">Crear colaborador</h3>
        <div class="form-row">
          <input type="text" id="newCollabName" placeholder="Nombre completo" />
        </div>
        <div class="form-row">
          <input type="email" id="newCollabEmail" placeholder="Email del colaborador" />
          <input type="password" id="newCollabPin" placeholder="PIN (mín. 6 caracteres)" />
        </div>
        <button id="addCollabBtn">Crear colaborador</button>
        <div class="status-msg" id="collabStatus"></div>
      </div>
    </div>

  </div>
</div>

<script>
  // ⚠️ REEMPLAZA con tus valores reales (Settings → API en Supabase)
  const SUPABASE_URL = "TU_PROJECT_URL_AQUI";
  const SUPABASE_ANON_KEY = "TU_ANON_KEY_AQUI";
  // URL de tu Edge Function (Settings → Edge Functions, o el patrón de abajo)
  const EDGE_FUNCTION_URL = SUPABASE_URL.replace(".supabase.co", ".supabase.co") + "/functions/v1/create-collaborator";
  const CONNECT_SOCIAL_URL = SUPABASE_URL + "/functions/v1/connect-social-account";
  // ⚠️ REEMPLAZA con el App ID de tu app en developers.facebook.com
  const META_APP_ID = "TU_META_APP_ID_AQUI";

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let followersChartInstance = null;
  let reachChartInstance = null;

  let currentUser = null;
  let currentProfile = null;
  let profiles = [];
  let clients = [];
  let tasks = [];
  let currentWeekStart = getMonday(new Date());
  let currentTab = "semanal";

  // ---------- Utilidades de fecha ----------
  function getMonday(d) {
    const date = new Date(d);
    const day = date.getDay();
    const diff = date.getDate() - day + (day === 0 ? -6 : 1);
    date.setDate(diff);
    date.setHours(0,0,0,0);
    return date;
  }
  function fmtDate(d) {
    return d.toISOString().split("T")[0];
  }
  function fmtLabel(d) {
    const end = new Date(d);
    end.setDate(end.getDate() + 6);
    const opts = { day: "numeric", month: "short" };
    return `${d.toLocaleDateString("es-ES", opts)} — ${end.toLocaleDateString("es-ES", opts)}`;
  }

  // ---------- LOGIN ----------
  const loginScreen = document.getElementById("loginScreen");
  const appScreen = document.getElementById("appScreen");
  const emailInput = document.getElementById("emailInput");
  const pinInput = document.getElementById("pinInput");
  const loginError = document.getElementById("loginError");

  document.getElementById("loginBtn").addEventListener("click", login);
  pinInput.addEventListener("keydown", e => { if (e.key === "Enter") login(); });
  document.getElementById("logoutBtn").addEventListener("click", logout);

  async function login() {
    loginError.textContent = "";
    const email = emailInput.value.trim();
    const pin = pinInput.value.trim();
    if (!email || !pin) { loginError.textContent = "Completa email y PIN."; return; }
    const { data, error } = await supabase.auth.signInWithPassword({ email, password: pin });
    if (error) { loginError.textContent = "PIN o email incorrecto."; return; }
    currentUser = data.user;
    await afterLogin();
  }

  async function logout() {
    await supabase.auth.signOut();
    currentUser = null; currentProfile = null;
    loginScreen.classList.remove("hidden");
    appScreen.classList.add("hidden");
  }

  async function afterLogin() {
    const { data: profile, error } = await supabase.from("profiles").select("*").eq("id", currentUser.id).single();
    if (error || !profile) {
      loginError.textContent = "No se pudo cargar tu perfil. Intenta de nuevo.";
      return;
    }
    currentProfile = profile;
    loginScreen.classList.add("hidden");
    appScreen.classList.remove("hidden");
    document.getElementById("userLabel").textContent = profile.full_name;
    if (profile.role === "admin") {
      document.getElementById("roleBadge").classList.remove("hidden");
      document.getElementById("adminTabBtn").classList.remove("hidden");
    }
    await loadClients();
    await loadProfiles();
    document.getElementById("taskAssignee").value = currentUser.id;
    await loadTasks();
    renderWeekLabel();
    render();
    subscribeRealtime();
  }

  async function checkSession() {
    const { data } = await supabase.auth.getSession();
    if (data.session) { currentUser = data.session.user; await afterLogin(); }
  }
  checkSession();

  // ---------- TABS ----------
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentTab = btn.dataset.tab;
      document.querySelectorAll(".tab-content").forEach(c => c.classList.add("hidden"));
      document.getElementById("tab-" + currentTab).classList.remove("hidden");
      document.getElementById("newTaskCard").classList.toggle("hidden", currentTab === "admin");
      render();
    });
  });

  // ================= MODAL: Reporte RR.SS =================
  const rrssModal = document.getElementById("rrssModal");
  document.getElementById("openRrssBtn").addEventListener("click", () => {
    rrssModal.classList.remove("hidden");
    loadReport();
  });
  document.getElementById("closeRrssBtn").addEventListener("click", () => {
    rrssModal.classList.add("hidden");
  });
  rrssModal.addEventListener("click", (e) => {
    if (e.target === rrssModal) rrssModal.classList.add("hidden");
  });

  // ---------- CARGA DE DATOS ----------
  async function loadClients() {
    const { data, error } = await supabase.from("clients").select("*").order("name");
    if (!error) {
      clients = data;
      const sel = document.getElementById("taskClient");
      sel.innerHTML = `<option value="">Sin marca/cliente</option>` +
        clients.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");
      const reportSel = document.getElementById("reportClient");
      if (reportSel) {
        reportSel.innerHTML = clients.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");
      }
    }
  }

  async function loadProfiles() {
    const { data, error } = await supabase.from("profiles").select("*").order("full_name");
    if (!error) {
      profiles = data;
      const sel = document.getElementById("taskAssignee");
      sel.innerHTML = `<option value="">Sin asignar</option>` +
        profiles.map(p => `<option value="${p.id}">${escapeHtml(p.full_name)}</option>`).join("");
    }
  }

  async function loadTasks() {
    const { data, error } = await supabase.from("tasks").select("*").order("created_at", { ascending: true });
    if (!error) { tasks = data; render(); }
  }

  function subscribeRealtime() {
    supabase.channel("tasks-changes")
      .on("postgres_changes", { event: "*", schema: "public", table: "tasks" }, () => loadTasks())
      .subscribe();
  }

  // ---------- RENDER ----------
  function render() {
    if (currentTab === "semanal") renderWeekly();
    if (currentTab === "general360") render360();
  }

  function renderWeekLabel() {
    document.getElementById("weekLabel").textContent = fmtLabel(currentWeekStart);
    document.getElementById("taskWeek").value = fmtDate(currentWeekStart);
  }

  document.getElementById("prevWeek").addEventListener("click", () => {
    currentWeekStart.setDate(currentWeekStart.getDate() - 7);
    renderWeekLabel(); render();
  });
  document.getElementById("nextWeek").addEventListener("click", () => {
    currentWeekStart.setDate(currentWeekStart.getDate() + 7);
    renderWeekLabel(); render();
  });

  function renderWeekly() {
    const weekStr = fmtDate(currentWeekStart);
    const myTasks = tasks.filter(t => t.assigned_to === currentUser.id && t.week_start === weekStr);
    const list = document.getElementById("weeklyList");
    list.innerHTML = "";
    if (myTasks.length === 0) {
      list.innerHTML = `<li class="empty" style="border:none;background:none;">No tienes tareas asignadas esta semana 🎉</li>`;
      return;
    }
    myTasks.forEach(t => list.appendChild(renderTaskLi(t)));
  }

  function render360() {
    const container = document.getElementById("clientGroups");
    container.innerHTML = "";
    const grouped = {};
    tasks.forEach(t => {
      const key = t.client_id || "sin-marca";
      if (!grouped[key]) grouped[key] = [];
      grouped[key].push(t);
    });
    const keys = Object.keys(grouped);
    if (keys.length === 0) {
      container.innerHTML = `<div class="empty">No hay pendientes registrados todavía.</div>`;
      return;
    }
    keys.forEach(key => {
      const client = clients.find(c => c.id === key);
      const div = document.createElement("div");
      div.className = "client-group card";
      const name = client ? client.name : "Sin marca / cliente";
      const color = client ? client.color : "#64748b";
      div.innerHTML = `<h3><span class="dot" style="background:${color}"></span>${escapeHtml(name)}</h3><ul class="tasklist"></ul>`;
      const ul = div.querySelector("ul");
      grouped[key].forEach(t => ul.appendChild(renderTaskLi(t)));
      container.appendChild(div);
    });
  }

  function renderTaskLi(t) {
    const li = document.createElement("li");
    li.className = t.done ? "done" : "";
    const assignee = profiles.find(p => p.id === t.assigned_to);
    const client = clients.find(c => c.id === t.client_id);
    li.innerHTML = `
      <div class="check" data-id="${t.id}">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <div class="info">
        <div class="title">${escapeHtml(t.title)}</div>
        <div class="meta">${assignee ? "👤 " + escapeHtml(assignee.full_name) : "Sin asignar"} ${client ? "· " + escapeHtml(client.name) : ""} ${t.week_start ? "· Semana " + t.week_start : ""}</div>
      </div>
      <button class="delete" data-id="${t.id}">✕</button>
    `;
    return li;
  }

  document.addEventListener("click", async e => {
    const checkEl = e.target.closest(".check");
    const delEl = e.target.closest(".delete");
    if (checkEl && checkEl.dataset.id) {
      const id = checkEl.dataset.id;
      const t = tasks.find(x => x.id === id);
      if (!t) return;
      const { error } = await supabase.from("tasks").update({ done: !t.done }).eq("id", id);
      if (!error) { t.done = !t.done; render(); }
    }
    if (delEl && delEl.dataset.id && delEl.closest("li")) {
      const id = delEl.dataset.id;
      const { error } = await supabase.from("tasks").delete().eq("id", id);
      if (!error) { tasks = tasks.filter(x => x.id !== id); render(); }
    }
  });

  // ---------- NUEVA TAREA ----------
  document.getElementById("addTaskBtn").addEventListener("click", async () => {
    const title = document.getElementById("taskTitle").value.trim();
    const client_id = document.getElementById("taskClient").value || null;
    const assigned_to = document.getElementById("taskAssignee").value || null;
    const week_start = document.getElementById("taskWeek").value || fmtDate(currentWeekStart);
    const statusEl = document.getElementById("addTaskStatus");
    statusEl.textContent = "";
    if (!title) { statusEl.textContent = "Escribe un título."; statusEl.className = "status-msg err"; return; }

    const { data, error } = await supabase.from("tasks").insert([{
      title, client_id, assigned_to, week_start, done: false, created_by: currentUser.id
    }]).select();

    if (error) {
      statusEl.textContent = "❌ No se guardó: " + error.message;
      statusEl.className = "status-msg err";
      return;
    }
    tasks.push(data[0]);
    document.getElementById("taskTitle").value = "";
    statusEl.textContent = "✅ Tarea guardada.";
    statusEl.className = "status-msg ok";
    render();
  });

  // ---------- ADMIN: crear marca ----------
  document.getElementById("addClientBtn").addEventListener("click", async () => {
    const name = document.getElementById("newClientName").value.trim();
    const color = document.getElementById("newClientColor").value;
    const statusEl = document.getElementById("clientStatus");
    if (!name) { statusEl.textContent = "Escribe un nombre."; statusEl.className = "status-msg err"; return; }
    const { data, error } = await supabase.from("clients").insert([{ name, color }]).select();
    if (error) { statusEl.textContent = "❌ " + error.message; statusEl.className = "status-msg err"; return; }
    clients.push(data[0]);
    await loadClients();
    document.getElementById("newClientName").value = "";
    statusEl.textContent = "✅ Marca creada.";
    statusEl.className = "status-msg ok";
  });

  // ---------- ADMIN: crear colaborador (vía Edge Function) ----------
  document.getElementById("addCollabBtn").addEventListener("click", async () => {
    const full_name = document.getElementById("newCollabName").value.trim();
    const email = document.getElementById("newCollabEmail").value.trim();
    const pin = document.getElementById("newCollabPin").value.trim();
    const statusEl = document.getElementById("collabStatus");
    statusEl.textContent = "";
    if (!full_name || !email || !pin) { statusEl.textContent = "Completa todos los campos."; statusEl.className = "status-msg err"; return; }

    const { data: sessionData } = await supabase.auth.getSession();
    const token = sessionData.session.access_token;

    try {
      const res = await fetch(EDGE_FUNCTION_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ email, pin, full_name })
      });
      const json = await res.json();
      if (!res.ok) { statusEl.textContent = "❌ " + json.error; statusEl.className = "status-msg err"; return; }
      statusEl.textContent = "✅ Colaborador creado: " + email;
      statusEl.className = "status-msg ok";
      document.getElementById("newCollabName").value = "";
      document.getElementById("newCollabEmail").value = "";
      document.getElementById("newCollabPin").value = "";
      await loadProfiles();
    } catch (err) {
      statusEl.textContent = "❌ Error de conexión con la función.";
      statusEl.className = "status-msg err";
    }
  });

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  // ================= REPORTES =================
  document.getElementById("reportClient")?.addEventListener("change", loadReport);
  document.getElementById("reportRange")?.addEventListener("change", loadReport);

  async function loadReport() {
    const clientSel = document.getElementById("reportClient");
    if (!clientSel || clientSel.options.length === 0) {
      document.getElementById("reportStatus").textContent = "Primero crea al menos una marca/cliente desde la pestaña Admin.";
      document.getElementById("reportStatus").className = "status-msg err";
      return;
    }
    const clientId = clientSel.value;
    const days = parseInt(document.getElementById("reportRange").value, 10);
    const statusEl = document.getElementById("reportStatus");
    if (!clientId) return;

    statusEl.textContent = "";
    const sinceDate = new Date();
    sinceDate.setDate(sinceDate.getDate() - days);
    const sinceStr = fmtDate(sinceDate);

    const { data: metrics, error } = await supabase
      .from("social_metrics")
      .select("*")
      .eq("client_id", clientId)
      .gte("metric_date", sinceStr)
      .order("metric_date", { ascending: true });

    if (error) { statusEl.textContent = "❌ " + error.message; statusEl.className = "status-msg err"; return; }

    if (!metrics || metrics.length === 0) {
      statusEl.textContent = "Aún no hay métricas para este cliente. Conecta su cuenta de Instagram y espera al primer reporte automático (se genera 1 vez al día).";
      statusEl.className = "status-msg";
      document.getElementById("summaryCards").innerHTML = "";
      if (followersChartInstance) followersChartInstance.destroy();
      if (reachChartInstance) reachChartInstance.destroy();
      document.getElementById("topPostsList").innerHTML = "";
      return;
    }

    renderSummaryCards(metrics);
    renderFollowersChart(metrics);
    renderReachChart(metrics);
    await loadTopPosts(clientId);
  }

  function renderSummaryCards(metrics) {
    const latest = metrics[metrics.length - 1];
    const first = metrics[0];
    const followerGrowth = (latest.followers ?? 0) - (first.followers ?? 0);
    const avgReach = Math.round(metrics.reduce((sum, m) => sum + (m.reach ?? 0), 0) / metrics.length);

    const cards = [
      { label: "Seguidores actuales", value: latest.followers ?? "—" },
      { label: "Crecimiento del período", value: (followerGrowth >= 0 ? "+" : "") + followerGrowth },
      { label: "Alcance promedio diario", value: avgReach },
      { label: "Publicaciones", value: latest.posts_count ?? "—" },
    ];

    document.getElementById("summaryCards").innerHTML = cards.map(c => `
      <div style="flex:1; min-width:130px;">
        <div style="font-size:1.4rem; font-weight:700;">${c.value}</div>
        <div style="font-size:0.75rem; color:var(--text-dim);">${c.label}</div>
      </div>
    `).join("");
  }

  function renderFollowersChart(metrics) {
    const ctx = document.getElementById("followersChart");
    if (followersChartInstance) followersChartInstance.destroy();
    followersChartInstance = new Chart(ctx, {
      type: "line",
      data: {
        labels: metrics.map(m => m.metric_date),
        datasets: [{
          label: "Seguidores",
          data: metrics.map(m => m.followers),
          borderColor: "#6366f1",
          backgroundColor: "rgba(99,102,241,0.15)",
          fill: true,
          tension: 0.3,
        }]
      },
      options: { responsive: true, plugins: { legend: { display: false } },
        scales: { x: { ticks: { color: "#94a3b8" } }, y: { ticks: { color: "#94a3b8" } } } }
    });
  }

  function renderReachChart(metrics) {
    const ctx = document.getElementById("reachChart");
    if (reachChartInstance) reachChartInstance.destroy();
    reachChartInstance = new Chart(ctx, {
      type: "bar",
      data: {
        labels: metrics.map(m => m.metric_date),
        datasets: [
          { label: "Alcance", data: metrics.map(m => m.reach), backgroundColor: "#22c55e" },
          { label: "Impresiones", data: metrics.map(m => m.impressions), backgroundColor: "#e59e2c" },
        ]
      },
      options: { responsive: true, plugins: { legend: { labels: { color: "#e2e8f0" } } },
        scales: { x: { ticks: { color: "#94a3b8" } }, y: { ticks: { color: "#94a3b8" } } } }
    });
  }

  async function loadTopPosts(clientId) {
    const { data: posts } = await supabase
      .from("social_top_posts")
      .select("*")
      .eq("client_id", clientId)
      .order("likes", { ascending: false })
      .limit(5);

    const list = document.getElementById("topPostsList");
    list.innerHTML = "";
    if (!posts || posts.length === 0) {
      list.innerHTML = `<li class="empty" style="border:none;background:none;">Sin publicaciones registradas todavía.</li>`;
      return;
    }
    posts.forEach(p => {
      const li = document.createElement("li");
      li.innerHTML = `
        <div class="info">
          <div class="title">${escapeHtml((p.caption || "Sin descripción").slice(0, 80))}</div>
          <div class="meta">❤️ ${p.likes ?? 0} · 💬 ${p.comments ?? 0} ${p.permalink ? `· <a href="${p.permalink}" target="_blank" style="color:var(--accent);">Ver post</a>` : ""}</div>
        </div>
      `;
      list.appendChild(li);
    });
  }

  // ================= CONECTAR INSTAGRAM (solo admin) =================
  document.getElementById("connectIgBtn")?.addEventListener("click", () => {
    if (typeof FB === "undefined") {
      alert("El SDK de Facebook no cargó todavía. Intenta de nuevo en unos segundos.");
      return;
    }
    FB.init({ appId: META_APP_ID, cookie: true, xfbml: false, version: "v21.0" });
    FB.login(async (response) => {
      if (response.authResponse) {
        const shortLivedToken = response.authResponse.accessToken;
        await handleFacebookConnected(shortLivedToken);
      }
    }, { scope: "instagram_basic,instagram_manage_insights,pages_read_engagement,pages_show_list" });
  });

  async function handleFacebookConnected(shortLivedToken) {
    const statusEl = document.getElementById("reportStatus");
    const clientId = document.getElementById("reportClient").value;
    if (!clientId) { statusEl.textContent = "Selecciona primero un cliente."; statusEl.className = "status-msg err"; return; }

    statusEl.textContent = "Buscando cuentas de Instagram vinculadas...";
    statusEl.className = "status-msg";

    try {
      // 1. Obtener páginas de Facebook administradas por este usuario
      const pagesRes = await fetch(`https://graph.facebook.com/v21.0/me/accounts?access_token=${shortLivedToken}`);
      const pagesData = await pagesRes.json();

      if (!pagesData.data || pagesData.data.length === 0) {
        statusEl.textContent = "No se encontraron páginas de Facebook. Verifica que el cliente tenga una Página vinculada a su Instagram de empresa.";
        statusEl.className = "status-msg err";
        return;
      }

      // 2. Buscar la cuenta de Instagram vinculada a la primera página (ajustar si hay varias)
      const page = pagesData.data[0];
      const igRes = await fetch(`https://graph.facebook.com/v21.0/${page.id}?fields=instagram_business_account&access_token=${page.access_token}`);
      const igData = await igRes.json();

      if (!igData.instagram_business_account) {
        statusEl.textContent = `La página "${page.name}" no tiene una cuenta de Instagram de empresa vinculada.`;
        statusEl.className = "status-msg err";
        return;
      }

      const igUserId = igData.instagram_business_account.id;

      // 3. Enviar a la Edge Function para guardar el token de forma segura
      const { data: sessionData } = await supabase.auth.getSession();
      const token = sessionData.session.access_token;

      const res = await fetch(CONNECT_SOCIAL_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({
          client_id: clientId,
          short_lived_token: page.access_token,
          ig_user_id: igUserId,
          account_name: page.name,
        })
      });
      const json = await res.json();

      if (!res.ok) {
        statusEl.textContent = "❌ " + json.error;
        statusEl.className = "status-msg err";
        return;
      }

      statusEl.textContent = `✅ Cuenta de Instagram de "${page.name}" conectada. El primer reporte aparecerá en el siguiente ciclo automático.`;
      statusEl.className = "status-msg ok";
    } catch (err) {
      statusEl.textContent = "❌ Error al conectar: " + String(err);
      statusEl.className = "status-msg err";
    }
  }
</script>
</body>
